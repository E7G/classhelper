name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Source validation
        run: python3 tools/validate_source.py
      - name: Fetch sherpa-onnx runtime
        run: ./gradlew :app:fetchSherpaAar --stacktrace
      - name: Lint and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ClassHelperNative-debug
          path: app/build/outputs/apk/debug/app-debug.apk
